version: '3.8'

services:
  prefill:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nano-vllm-prefill
    hostname: prefill
    privileged: true
    network_mode: host
    environment:
      - ROLE=prefill
      - MODEL_PATH=/model
      - PREFILL_HOST=127.0.0.1
      - PREFILL_PORT=8050
      - DECODE_HOST=127.0.0.1
      - DECODE_PORT=8060
    volumes:
      - model-cache:/model
    command: []

  decode:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nano-vllm-decode
    hostname: decode
    privileged: true
    network_mode: host
    environment:
      - ROLE=decode
      - MODEL_PATH=/model
      - PREFILL_HOST=127.0.0.1
      - PREFILL_PORT=8050
      - DECODE_HOST=127.0.0.1
      - DECODE_PORT=8060
    volumes:
      - model-cache:/model
    depends_on:
      - prefill
    command: []

  # For multi-node deployment, use overlay network instead of host
  # prefill:
  #   networks:
  #     - pd-network
  # decode:
  #   networks:
  #     - pd-network

volumes:
  model-cache:

