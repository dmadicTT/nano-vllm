[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "tqdm",
    "xxhash",
    # HTTP client used by the PD worker (`PDClient`) — already pulled in by
    # mooncake's transitive deps, but we use it directly so we declare it.
    "requests",
    # Mooncake stack — master service binary + Python bindings ship in this wheel.
    "mooncake-transfer-engine",
    # The Mooncake wheel is built against CUDA 12 even on CPU hosts, so the
    # dynamic loader needs libcudart.so.12 to resolve symbols. CUDA itself is
    # not used at runtime on the CPU path.
    "nvidia-cuda-runtime-cu12",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
